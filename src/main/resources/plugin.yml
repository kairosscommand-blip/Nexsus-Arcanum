name: NexusArcanum
version: ${project.version}
main: com.nexuscraft.nexusarcanum.NexusArcanumPlugin
api-version: '1.21'
author: RealSociety
description: "A massive overhaul of the vanilla enchanting table. Real bookshelf placement still matters, but now so does a real chiseled bookshelf (vanilla's own table ignores it entirely) and a balanced, symmetric arrangement -- together they drive a level-cost ceiling well past vanilla's flat 30 and a five-tier rarity system (Common through Mythic) that can grant more than one real vanilla enchantment from a single offer at the top two tiers. Every enchantment granted is a real, ordinary vanilla enchantment -- nothing here is a custom effect system."

commands:
  nexusarcanum:
    description: Reload NexusArcanum's config, or inspect the resonance of a table you're looking at.
    usage: /nexusarcanum <reload|inspect>
    aliases: [arcanum, nexarcanum]
    permission: nexusarcanum.use
    permission-message: "§cYou don't have permission to do that."

permissions:
  nexusarcanum.admin:
    description: Reload NexusArcanum's config.
    default: op
  nexusarcanum.use:
    description: Inspect an enchanting table's resonance.
    default: true
